<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0f;
      color: white;
      overflow: hidden;
    }

    /* Background glow */
    body::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: #6c63ff;
      border-radius: 50%;
      filter: blur(180px);
      opacity: 0.25;
      top: -150px;
      left: -100px;
    }

    body::after {
      content: "";
      position: absolute;
      width: 450px;
      height: 450px;
      background: #00c6ff;
      border-radius: 50%;
      filter: blur(180px);
      opacity: 0.18;
      bottom: -150px;
      right: -100px;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 25px;
      max-width: 700px;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.05);
      color: #b8b5ff;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(48px, 8vw, 90px);
      line-height: 1;
      letter-spacing: -4px;
      margin-bottom: 25px;
      background: linear-gradient(90deg, #ffffff, #aaa7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #a5a5ad;
      font-size: 18px;
      line-height: 1.7;
      max-width: 520px;
      margin: 0 auto 35px;
    }

    .loader {
      width: 45px;
      height: 45px;
      margin: 0 auto;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .footer {
      position: fixed;
      bottom: 25px;
      left: 0;
      right: 0;
      text-align: center;
      color: #55555e;
      font-size: 13px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      h1 {
        letter-spacing: -2px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="badge">Something new is coming</div>

    <h1>Coming Soon.</h1>

    <p>
      We're working on something exciting.
      Stay tuned — we'll be launching very soon.
    </p>

    <div class="loader"></div>

  </main>

  <div class="footer">
    © 2026 · All rights reserved.
  </div>

</body>
</html>
